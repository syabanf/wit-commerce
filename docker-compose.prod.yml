# The whole product in Docker: Postgres, the API and the web server that serves the admin, the
# storefront and the seller app. scripts/deploy-prod.sh starts it on a server with values from
# .env.production, which git ignores. On a laptop:
#
#   cp deploy/.env.docker.example deploy/.env.docker
#   docker compose -f docker-compose.prod.yml --env-file deploy/.env.docker up --build
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: commerce
      POSTGRES_USER: commerce
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/deploy-prod.sh}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U commerce -d commerce']
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://commerce:${POSTGRES_PASSWORD}@postgres:5432/commerce?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?run scripts/deploy-prod.sh}
      CREDENTIALS_KEY: ${CREDENTIALS_KEY:?run scripts/deploy-prod.sh}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?run scripts/deploy-prod.sh}
      DEMO_LOGIN: ${DEMO_LOGIN:-false}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:?run scripts/deploy-prod.sh}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-deepseek-v4.1-flash}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      # Email links and the payment return go to https://{subdomain}.$STORE_ROOT_DOMAIN; empty keeps
      # them at $PUBLIC_URL/shop/{subdomain}.
      STORE_ROOT_DOMAIN: ${STORE_ROOT_DOMAIN:-}
      MEDIA_DIR: /media
      TRUST_PROXY: 'true'
      PORT: '8090'
      # With SPLIT_SERVICES=true the shop service streams deltas through Postgres NOTIFY, and the
      # notifier service sends the queued email in place of the API.
      EVENTS_NOTIFY: ${SPLIT_SERVICES:-false}
      NOTIFIER_EXTERNAL: ${SPLIT_SERVICES:-false}
    # Uploaded images, written by the API as uid 10001 with mode 0644 and served by web from the same
    # place. An absolute path is a host folder, which deploy-prod.sh creates and hands to uid 10001;
    # a plain name such as "media" is a Docker volume instead.
    volumes:
      - ${MEDIA_ROOT:-/var/lib/commerce/media}:/media
    # Health checks and the admin bootstrap on this machine reach the API here; browsers go through web.
    ports:
      - '127.0.0.1:${API_PORT:-8090}:8090'

  # The services below run only with SPLIT_SERVICES=true, which deploy-prod.sh turns into the
  # "split" profile. They share the API's image and database; the API owns the schema.
  ai:
    profiles: [split]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    entrypoint: ['/app/ai']
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      DATABASE_URL: postgres://commerce:${POSTGRES_PASSWORD}@postgres:5432/commerce?sslmode=disable
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:?run scripts/deploy-prod.sh}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-deepseek-v4.1-flash}
      TRUST_PROXY: 'true'
      PORT: '8091'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8091/health']
      interval: 10s
      timeout: 3s
      retries: 5
    ports:
      - '127.0.0.1:${AI_PORT:-8091}:8091'

  notifier:
    profiles: [split]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    entrypoint: ['/app/notifier']
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      DATABASE_URL: postgres://commerce:${POSTGRES_PASSWORD}@postgres:5432/commerce?sslmode=disable
      # Opens the Resend key a platform admin saves under Settings → Email.
      CREDENTIALS_KEY: ${CREDENTIALS_KEY:?run scripts/deploy-prod.sh}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      PORT: '8092'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8092/health']
      interval: 10s
      timeout: 3s
      retries: 5

  shop:
    profiles: [split]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    entrypoint: ['/app/shop']
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      DATABASE_URL: postgres://commerce:${POSTGRES_PASSWORD}@postgres:5432/commerce?sslmode=disable
      PORT: '8093'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8093/api/v1/health']
      interval: 10s
      timeout: 3s
      retries: 5
    ports:
      - '127.0.0.1:${SHOP_PORT:-8093}:8093'

  # The only service that faces the network: nginx with the admin at /, the storefront under /shop/ or
  # on store hosts, the seller app under /seller/, and /api/ and /media/. The Vite values are compiled
  # in, so changing PUBLIC_URL, STORE_ROOT_DOMAIN or DEMO_LOGIN needs `up --build`.
  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      args:
        VITE_API_URL: /api
        VITE_STORE_ROOT_DOMAIN: ${STORE_ROOT_DOMAIN:-}
        VITE_STOREFRONT_URL: ${PUBLIC_URL:-http://localhost}/shop
        VITE_ADMIN_ORIGINS: ${PUBLIC_URL:-http://localhost}
        # Empty unless DEMO_LOGIN=true; then it is the public demo password.
        VITE_DEMO_PASSWORD: ${VITE_DEMO_PASSWORD:-}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      STORE_ROOT_DOMAIN: ${STORE_ROOT_DOMAIN:-}
      SPLIT_SERVICES: ${SPLIT_SERVICES:-false}
    volumes:
      - ${MEDIA_ROOT:-/var/lib/commerce/media}:/media:ro
      # Put fullchain.pem and privkey.pem here to serve HTTPS on 443; without them web serves plain
      # http on 80 for Cloudflare or another proxy in front.
      - ${WEB_CERTS:-./deploy/certs}:/etc/nginx/certs:ro
    # The 443 mapping is harmless while no certificates are mounted: nothing listens behind it.
    ports:
      - '${WEB_BIND:-0.0.0.0}:${WEB_PORT:-80}:80'
      - '${WEB_BIND:-0.0.0.0}:${WEB_TLS_PORT:-443}:443'

volumes:
  pgdata:
  # Used only when MEDIA_ROOT=media, as on a laptop.
  media:
