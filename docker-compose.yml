services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: commerce
      POSTGRES_USER: commerce
      POSTGRES_PASSWORD: commerce
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./apps/api/docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-test-database.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U commerce -d commerce']
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    profiles: ['full']
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://commerce:commerce@postgres:5432/commerce?sslmode=disable
      JWT_SECRET: change-me-in-production
      DEMO_PASSWORD: commerce-demo
      PORT: '8090'
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
    ports:
      - '8090:8090'

volumes:
  pgdata:
