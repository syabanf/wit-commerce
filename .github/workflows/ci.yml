name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: commerce
          POSTGRES_USER: commerce
          POSTGRES_PASSWORD: commerce
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U commerce -d commerce"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://commerce:commerce@localhost:5433/commerce?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - run: pnpm install --frozen-lockfile
      - name: Seed is up to date
        run: pnpm gen:fixtures && git diff --exit-code -- packages/fixtures/data
      - name: Golden cases are up to date
        run: pnpm gen:golden && git diff --exit-code -- apps/api/testdata
      - name: OpenAPI document is up to date
        run: pnpm gen:openapi && git diff --exit-code -- apps/api/openapi.json
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:api
      - run: pnpm build

  # Builds both production images without pushing them, so a broken Dockerfile fails CI.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web/Dockerfile
          push: false
          load: true
          tags: web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - name: Web config renders and passes nginx -t in both host modes
        run: |
          docker run --rm web:ci nginx -t
          docker run --rm -e STORE_ROOT_DOMAIN=shop.example.com -e SPLIT_SERVICES=true web:ci nginx -t
